<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <!-- Offline by construction: no remote origin is permitted at all. `img-src
       data:` is what lets the engine's inline face thumbnails render. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:*; font-src 'self'; form-action 'none'; base-uri 'none';" />
  <title>FaceFlow</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/views.css" />
</head>
<body>
  <a class="skip-link" href="#pane">Skip to content</a>

    <symbol id="i-tag" viewBox="0 0 24 24">

    <symbol id="i-merge" viewBox="0 0 24 24">
      <path d="M6 20V10a4 4 0 0 1 4-4h8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="m15 3 3 3-3 3" stroke-linecap="round" stroke-linejoin="round" />

  <div class="app">
    <!-- ============================================================ sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="icon"><use href="#i-logo" /></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">FaceFlow</span>
          <span class="brand-tag">Private photo organization</span>
        </span>
      </div>

      <nav class="nav" id="nav" aria-label="Sections"></nav>

      <div class="activity">
        <div class="activity-head">
          <span class="eyebrow">Recent activity</span>
          <button class="btn btn-ghost btn-icon btn-sm" id="activity-clear"
                  type="button" aria-label="Clear activity" title="Clear activity">
            <svg class="icon icon-sm"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="activity-list scroll-area" id="activity-list"></div>
      </div>

      <div class="sidebar-foot">
        <button class="foot-item" id="nav-settings" type="button">
          <svg class="icon"><use href="#i-settings" /></svg>
          <span>Settings</span>
        </button>
        <!-- The privacy claim, stated rather than implied. -->
        <div class="offline-chip" id="offline-chip" role="status">
          <span class="dot" aria-hidden="true"></span>
          <span>Offline · local only</span>
        </div>
      </div>
    </aside>

    <!-- ============================================================ content -->
    <div class="content">
      <header class="topbar">
        <div class="topbar-heading">
          <h1 class="topbar-title" id="page-title">Overview</h1>
          <p class="topbar-sub" id="page-sub"></p>
        </div>
        <div class="topbar-actions">
          <span class="engine-chip" id="engine-chip" data-state="connecting">
            <span class="dot" aria-hidden="true"></span>
            <span id="engine-label">starting</span>
          </span>
          <button class="btn btn-ghost btn-icon" id="theme-toggle" type="button"
                  aria-label="Switch to light theme" title="Switch to light theme">
            <svg class="icon" id="theme-icon"><use href="#i-sun" /></svg>
          </button>
        </div>
      </header>

      <main class="pane" id="pane" tabindex="-1">
        <div class="pane-inner" id="pane-inner"></div>
      </main>
    </div>
  </div>

  <div class="sr-only" id="live" aria-live="polite"></div>

  <!-- Classic scripts in dependency order: file:// blocks ES modules. -->
  <script src="js/dom.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/scan.js"></script>
  <script src="js/views/photos.js"></script>
  <script src="js/views/people.js"></script>
  <script src="js/views/relationships.js"></script>
  <script src="js/views/gallery.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
